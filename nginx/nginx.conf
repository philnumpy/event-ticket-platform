# Gateway / load balancer in front of two core-api replicas.
#
# Rate limiting here (`limit_req`) is Nginx's leaky-bucket algorithm, NOT a
# token bucket: it enforces a steady outflow rate with a fixed-size queue
# ("burst") for excess requests, which smooths bursts by delaying them
# rather than banking unused capacity for later. The platform's actual
# token-bucket requirement (services/core-api/src/common/rate-limit) is
# implemented at the application layer for that reason. This layer exists
# as a coarse, cheap first line of defense — reject obviously-abusive
# traffic (a single IP hammering the gateway) before it even reaches a
# core-api replica — not as the source of truth for per-client quotas. See
# docs/adr/0005-rate-limiting-and-resilience.md.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Zone sized for ~160K tracked IPs (10m at ~64 bytes/entry); 20 req/s
    # sustained per IP with headroom for the burst below.
    limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=20r/s;

    upstream core_api {
        # Round robin (the default) is sufficient here: core-api is
        # stateless (all state lives in Postgres/Redis/Kafka), so any
        # replica can serve any request -- no session affinity needed.
        server core-api-1:3000;
        server core-api-2:3000;
    }

    server {
        listen 80;

        location / {
            # burst=40 nodelay: absorb a short spike of up to 40 requests
            # beyond the steady 20r/s rate immediately (nodelay), rather
            # than queuing them -- appropriate for an API gateway serving
            # interactive clients, where queuing delay would just move
            # latency around instead of removing it.
            limit_req zone=gateway_limit burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}

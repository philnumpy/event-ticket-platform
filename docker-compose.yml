services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etp
      POSTGRES_PASSWORD: etp
      POSTGRES_DB: etp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etp -d etp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft mode (no Zookeeper) -- sufficient for a laptop-scale
  # demo. AUTO_CREATE_TOPICS is on so the app services don't need a
  # separate topic-provisioning step; a real deployment would pre-create
  # topics with explicit partition counts instead.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://etp:etp@postgres:5432/etp
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      PAYMENT_FAILURE_RATE: "0.1"
      PAYMENT_TIMEOUT_RATE: "0.05"
      PAYMENT_DUPLICATE_CALLBACK_RATE: "0.05"
    depends_on:
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
